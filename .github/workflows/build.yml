name: Build Karmis AI

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win nsis portable --publish never
      - run: dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: karmis-windows
          path: |
            dist/Karmis-AI-Setup.exe
            dist/Karmis-AI-Portable.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: node scripts/patch-android.js
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - name: Give the APK a stable name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Karmis-AI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: karmis-android-apk
          path: Karmis-AI.apk
          if-no-files-found: error

  # Публикует готовые файлы в Releases: прямые ссылки на скачивание без входа в GitHub
  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - run: ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Karmis AI ${{ github.run_number }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            files/Karmis-AI.apk
            files/Karmis-AI-Setup.exe
            files/Karmis-AI-Portable.exe
          body: |
            ## Прямые ссылки (всегда ведут на последнюю версию)

            **Android:** https://github.com/${{ github.repository }}/releases/latest/download/Karmis-AI.apk
            **Windows (установщик):** https://github.com/${{ github.repository }}/releases/latest/download/Karmis-AI-Setup.exe
            **Windows (без установки):** https://github.com/${{ github.repository }}/releases/latest/download/Karmis-AI-Portable.exe

            Android: скачай `Karmis-AI.apk` и установи (разреши установку из неизвестных источников).
      - name: Показать ссылки в итогах запуска
        run: |
          {
            echo "## Скачать"
            echo "- Android: https://github.com/${{ github.repository }}/releases/latest/download/Karmis-AI.apk"
            echo "- Windows (установщик): https://github.com/${{ github.repository }}/releases/latest/download/Karmis-AI-Setup.exe"
            echo "- Windows (portable): https://github.com/${{ github.repository }}/releases/latest/download/Karmis-AI-Portable.exe"
          } >> "$GITHUB_STEP_SUMMARY"
