<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Кармис AI</title>
<link rel="stylesheet" href="mini.css">
</head>
<body>
<div class="mini" id="mini" data-state="idle">
  <header class="bar">
    <div class="orb" id="orb" title=""></div>
    <div class="who"><div class="title">Кармис</div><div class="status" id="status">Готовий</div></div>
    <div class="clock" id="clock"></div>
    <button class="ib" id="bEar" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M7 9a5 5 0 0 1 10 0c0 2.6-2 3.4-3 5.2-.8 1.4-.4 3.3-2.3 3.8-1.6.4-3-.7-3-2.2"/><path d="M10 9.2a2 2 0 0 1 4 0"/></svg></button>
    <button class="ib" id="bMute" type="button"><svg viewBox="0 0 24 24" id="icVol"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button class="ib" id="bExpand" type="button"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></button>
    <button class="ib" id="bClose" type="button"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="live" id="live" hidden></div>
  <div class="msgs" id="msgs"></div>
  <div class="chips" id="chips"></div>
  <form class="composer" id="form" autocomplete="off">
    <button class="ib mic" id="bMic" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <input id="inp" type="text" spellcheck="false" autocomplete="off">
    <button class="send" id="bSend" type="submit"><svg viewBox="0 0 24 24"><path d="M4 12L20 4l-6 16-3-6.5z"/></svg></button>
  </form>
</div>
<script src="mini.js"></script>
</body>
</html>
